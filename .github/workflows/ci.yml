name: ci

# Tylko pull requesty. Commity na develop nie odpalają testów, bo te same zmiany
# przeszły już przez PR; stan master przed wydaniem sprawdza release.yml, który
# uruchamia testy przed opublikowaniem czegokolwiek.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # windows, nie ubuntu: TargetFramework to net8.0-windows10.0.26100.0
    # i na Linuksie nie da się tego zbudować.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        # Osobno dwa projekty, NIE cała solucja: AIDemon2.sln zawiera wapproj,
        # którego targety DesktopBridge nie istnieją w SDK — "dotnet build" na
        # solucji kończy się błędem MSB4019.
        run: |
          dotnet restore AIDemon2/AIDemon2.csproj
          dotnet restore AIDemon2.Tests/AIDemon2.Tests.csproj

      - name: Build
        run: dotnet build AIDemon2/AIDemon2.csproj -c Release -p:Platform=x64 --no-restore

      - name: Test
        # Testy stoją na atrapach i bazie SQLite w pamięci — bez sieci i bez kluczy API.
        run: dotnet test AIDemon2.Tests/AIDemon2.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Release readiness
        # Nie przerywa PR-a: nie każdy PR podnosi wersję. Ostrzega tylko, gdy
        # VERSION zostało podniesione, a CHANGELOG nie ma czym opisać wydania.
        continue-on-error: true
        shell: pwsh
        run: pwsh tools/Release.ps1 -Command check
