name: release

# Wydanie wyzwala SCALENIE na master, które zmienia plik VERSION. Nie ma ręcznego
# tagowania — tag zakłada automat. Bramką jest numer w pliku VERSION: jeśli tag dla
# tej wersji już istnieje, przebieg kończy się bez żadnego skutku. Dzięki temu
# scalenie niezwiązane z wydaniem niczego nie publikuje, a ponowne uruchomienie
# jest bezpieczne.
on:
  push:
    branches: [master]
    # Filtr WYŁĄCZNIE na plik, z którego bramka czyta wersję (job `guard` niżej
    # woła tools/Release.ps1 -Command version, a ten czyta tylko VERSION).
    # Bez filtra każde scalenie na master startowało runner tylko po to, żeby
    # bramka stwierdziła "nic do wydania" — a job jest rozliczany od samego
    # startu (minimum 1 minuta). Skutki, przyjęte świadomie:
    # - push, który nie rusza VERSION, nie uruchamia NICZEGO — także zmiana
    #   samego tego pliku workflow; tę sprawdza się przez Run workflow;
    # - wydanie, które padło przed założeniem tagu (np. na testach), NIE ponowi
    #   się samo przy następnym scaleniu bez zmiany VERSION. Ponowienie (także
    #   po scaleniu poprawki) to Actions -> release -> Run workflow na master;
    #   bramka tagu działa wtedy tak samo, więc jest to bezpieczne. Ten workflow
    #   nie ma wejścia `force` — ręczne uruchomienie też przechodzi przez bramkę.
    paths:
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Bramka wersji to osobny, lekki job na ubuntu, a nie krok w jobie Windows:
  # przypadek "VERSION ruszony, ale tag tej wersji już jest" (np. poprawka
  # formatowania pliku) kosztuje 1 minutę ubuntu zamiast rozgrzania runnera
  # Windows rozliczanego z mnożnikiem 2x. Skrypt czyta wyłącznie plik VERSION
  # i nie wymaga dotneta; pwsh jest preinstalowany na ubuntu-latest.
  # Uwaga przy ponawianiu: "Re-run failed jobs" powtarza sam job `release`
  # z ZAPAMIĘTANĄ decyzją bramki; żeby bramka sprawdziła tagi od nowa, użyj
  # "Re-run all jobs" albo Run workflow.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.number }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Bramka pyta o tagi ZDALNE repozytorium (`git ls-remote` w kroku
          # `Read version`), więc pełna historia nie jest tu do niczego
          # potrzebna. `fetch-tags: true` celowo tu NIE ma: przy
          # `fetch-depth: 1` checkout i tak nie sprowadza tagów wskazujących
          # na starsze commity, więc ta opcja niczego by nie dawała.
          fetch-depth: 1

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = pwsh tools/Release.ps1 -Command version
          # Niezerowy kod wyjścia procesu potomnego nie przerywa kroku (pwsh 7.4:
          # $PSNativeCommandUseErrorActionPreference = $false), a `git ls-remote`
          # niżej nadpisałby $LASTEXITCODE — bez tego sprawdzenia zły VERSION
          # dawałby publish=yes i rozgrzewał runner Windows.
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($v)) {
            throw "Cannot read VERSION - refusing to release."
          }
          "number=$v" | Out-File $env:GITHUB_OUTPUT -Append
          # Pytamy o tagi ZDALNE repozytorium, nie lokalny magazyn tagów:
          # przy `fetch-depth: 1` checkout nie sprowadza tagów, więc
          # `git tag --list` zawsze widziałby pustkę i bramka przepuszczałaby
          # KAŻDE scalenie na master, łącznie z tymi bez podbitej wersji.
          $existing = git ls-remote --tags origin "refs/tags/v$v"
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot reach origin to check tag v$v - refusing to release blindly."
          }
          if ($existing) {
            Write-Host "Tag v$v already exists - nothing to release."
            "publish=no" | Out-File $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Version $v has not been released yet."
            "publish=yes" | Out-File $env:GITHUB_OUTPUT -Append
          }

  release:
    # Runner Windows startuje WYŁĄCZNIE, gdy bramka stwierdziła, że wersji
    # jeszcze nie wydano. Nieudana bramka (np. brak dostępu do origin) pomija
    # ten job, a przebieg kończy się na czerwono — jak dotąd.
    needs: guard
    if: needs.guard.outputs.publish == 'yes'
    runs-on: windows-2022
    # Najdłuższe i najbardziej ryzykowne kroki w repo to pakowanie MSIX
    # i self-contained publish. Bez limitu zawieszony przebieg liczy się
    # domyślnie przez 6 h, na Windowsie z mnożnikiem 2x.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # O istniejące tagi pyta już job `guard`; commit i tag wydania
          # dopychają się także z płytkiego klonu, więc pełna historia nie jest
          # tu do niczego potrzebna.
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Cache pakietów wprost przez actions/cache: `cache: true` w setup-dotnet
      # wymaga plików packages.lock.json, których to repo nie ma. Osobny człon
      # "release" w kluczu, bo tutaj do ~/.nuget/packages dochodzi jeszcze
      # runtime pack win-x64 z self-contained publish; `restore-keys` pozwala
      # odzyskać wpis zapisany przez ci.yml, zanim powstanie własny.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-release-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-release-
            nuget-${{ runner.os }}-

      # wapproj wymaga targetów DesktopBridge z Visual Studio — nie ma ich w SDK.
      # Obraz windows-2022 zawiera komponent Microsoft.VisualStudio.ComponentGroup.MSIX.Packaging.
      - uses: microsoft/setup-msbuild@v2

      - name: Test
        run: |
          dotnet build AIDemon2/AIDemon2.csproj -c Release -p:Platform=x64
          dotnet test AIDemon2.Tests/AIDemon2.Tests.csproj -c Release

      - name: Promote changelog and stamp manifest
        shell: pwsh
        run: |
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          pwsh tools/Release.ps1 -Command release -Date $date -OutFile RELEASE_NOTES.md
          Write-Host "--- release notes ---"
          Get-Content RELEASE_NOTES.md

      - name: Prepare signing certificate
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            # Brak sekretu nie przerywa wydania — powstaje pakiet niepodpisany,
            # który da się zainstalować przez Add-AppDevPackage.ps1.
            Write-Host "::warning::MSIX_PFX_BASE64 not set - building an unsigned package."
            "signed=false" | Out-File $env:GITHUB_OUTPUT -Append
          } else {
            $path = Join-Path $env:RUNNER_TEMP 'sign.pfx'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
            "signed=true" | Out-File $env:GITHUB_OUTPUT -Append
            "path=$path" | Out-File $env:GITHUB_OUTPUT -Append
          }

      - name: Build MSIX package
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          # Kolejność ma znaczenie: restore wapproj przed restore aplikacji.
          msbuild AIDemon2.Package\AIDemon2.Package.wapproj -t:Restore `
            -p:Configuration=Release -p:Platform=x64
          msbuild AIDemon2\AIDemon2.csproj -t:Restore `
            -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64

          $args = @(
            'AIDemon2.Package\AIDemon2.Package.wapproj'
            # -t:Publish, nie -t:Build: Build zostawia sam rozsypany layout,
            # paczkę tworzy dopiero Publish.
            '-t:Publish'
            '-p:Configuration=Release'
            '-p:Platform=x64'
            '-p:RuntimeIdentifier=win-x64'
            "-p:Version=${{ needs.guard.outputs.version }}"
            '-p:UapAppxPackageBuildMode=SideloadOnly'
            '-p:AppxBundle=Never'
            '-p:AppxAutoIncrementPackageRevision=false'
            "-p:AppxPackageDir=${{ github.workspace }}\artifacts\msix\"
          )
          if ('${{ steps.cert.outputs.signed }}' -eq 'true') {
            $args += '-p:AppxPackageSigningEnabled=true'
            $args += "-p:PackageCertificateKeyFile=${{ steps.cert.outputs.path }}"
            $args += "-p:PackageCertificatePassword=$env:PFX_PASSWORD"
          }
          msbuild @args

      # Portable ZIP is the artifact users actually install. An unsigned MSIX is
      # refused outright by Windows, and a bare .exe is blocked by browsers on
      # download - a ZIP is neither. Self-contained, so no .NET is required.
      - name: Build portable ZIP
        shell: pwsh
        run: |
          dotnet publish AIDemon2\AIDemon2.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o portable

          # The PDB would ship debug symbols to every user for no benefit.
          Remove-Item portable\*.pdb -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path artifacts\portable | Out-Null
          $zip = "artifacts\portable\AIDemon2-${{ needs.guard.outputs.version }}-win-x64.zip"
          Compress-Archive -Path portable\* -DestinationPath $zip -Force
          "Portable ZIP: {0:N1} MB" -f ((Get-Item $zip).Length / 1MB)

      - name: Remove certificate
        # always(): certyfikat ma zniknąć także po nieudanym buildzie. Warunku
        # bramki nie trzeba powtarzać — cały job startuje tylko przy publish=yes,
        # a brak pliku (certyfikat nie powstał) ignoruje SilentlyContinue.
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'sign.pfx') -ErrorAction SilentlyContinue

      - name: Commit release changes
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md AIDemon2.Package/Package.appxmanifest
          if (git diff --cached --quiet) {
            Write-Host "Nothing to commit (changelog section was already prepared)."
          } else {
            git commit -m "Release ${{ needs.guard.outputs.version }} [skip ci]"
            git push origin HEAD:master
          }

      - name: Tag
        shell: pwsh
        run: |
          $v = "${{ needs.guard.outputs.version }}"
          git tag -a "v$v" -m "AIDemon2 $v"
          git push origin "v$v"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.guard.outputs.version }}
          name: AIDemon2 ${{ needs.guard.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          files: |
            artifacts/portable/*.zip
            artifacts/msix/**/*.msix
            artifacts/msix/**/*.appx
            artifacts/msix/**/*.cer
